<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P Notes Sync</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    />
  </head>
  <body class="w-96 bg-gradient-to-br from-blue-50 via-blue-100 to-emerald-50 text-slate-800">
    <main class="p-4">
      <header class="mb-3 rounded-xl border border-blue-200 bg-white/90 p-3 shadow-sm">
        <h1 class="text-lg font-semibold text-blue-700">P2P Notes Sync</h1>
        <p class="text-xs text-slate-600">Shared notepad over WebRTC (no cloud sync).</p>
      </header>

      <section class="mb-3 rounded-xl border border-emerald-200 bg-white/90 p-3 shadow-sm">
        <label for="notes" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-emerald-700">Notes</label>
        <textarea
          id="notes"
          rows="6"
          class="w-full resize-none rounded-md border border-blue-200 bg-blue-50/50 p-2 text-sm focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-200"
          placeholder="Type notes here..."
        ></textarea>
      </section>

      <section class="mb-3 rounded-xl border border-blue-200 bg-white/90 p-3 shadow-sm">
        <div class="mb-2 flex items-center justify-between">
          <h2 class="text-xs font-semibold uppercase tracking-wide text-blue-700">Tasks</h2>
          <button id="addTask" class="rounded-md bg-emerald-500 px-2 py-1 text-xs font-semibold text-white hover:bg-emerald-600">+ Add</button>
        </div>
        <ul id="taskList" class="space-y-2"></ul>
      </section>

      <section class="rounded-xl border border-blue-300 bg-white/90 p-3 shadow-sm">
        <h2 class="mb-2 text-xs font-semibold uppercase tracking-wide text-blue-700">Pair devices</h2>
        <div class="mb-2 grid grid-cols-3 gap-2">
          <button id="createOffer" class="rounded-md bg-blue-600 px-2 py-1 text-xs font-semibold text-white hover:bg-blue-700">Create Offer</button>
          <button id="createAnswer" class="rounded-md bg-emerald-600 px-2 py-1 text-xs font-semibold text-white hover:bg-emerald-700">Create Answer</button>
          <button id="applySignal" class="rounded-md bg-cyan-600 px-2 py-1 text-xs font-semibold text-white hover:bg-cyan-700">Apply Signal</button>
        </div>
        <textarea id="signalInput" rows="5" class="w-full rounded-md border border-blue-200 p-2 text-xs focus:border-emerald-400 focus:outline-none focus:ring-2 focus:ring-emerald-200" placeholder="Paste offer/answer JSON here or generate one..."></textarea>
        <p id="syncStatus" class="mt-2 text-xs text-slate-600">Not connected</p>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
